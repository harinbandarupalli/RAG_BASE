services:
  # ============================================================================
  # 1. PostgreSQL 16 with pgvector Extension
  # ============================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_db}
      POSTGRES_USER: ${POSTGRES_USER:-rag_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_secure_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag_user} -d ${POSTGRES_DB:-rag_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 2. Redis 7 Alpine (Semantic Cache & Session State)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: rag_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================================
  # 3. Arize Phoenix (Self-Hosted Open-Source Observability UI)
  # ============================================================================
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: rag_phoenix
    restart: always
    ports:
      - "6006:6006"
    environment:
      PHOENIX_PORT: 6006
      PHOENIX_HOST: 0.0.0.0
    profiles:
      - observability

volumes:
  postgres_data:
  redis_data:
