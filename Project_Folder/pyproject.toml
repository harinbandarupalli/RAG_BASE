[project]
name = "enterprise-rag-starter-kit"
version = "0.1.0"
description = "Production-grade, Hexagonal LangChain & LangGraph RAG Starter Kit with Pluggable Observability, Two-Path Pipeline, and Decoupled UI"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Advanced AI Engineering Team" }
]
dependencies = [
    # LangChain Ecosystem
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.20",
    
    # Model Providers
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langchain-groq>=0.2.0",
    
    # Vector DB & Storage
    "langchain-postgres>=0.0.12",
    "pgvector>=0.3.0",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "psycopg[binary]>=3.2.0",
    "redis>=5.0.0",
    "alembic>=1.13.0",
    
    # Reranking & Hybrid Search
    "flashrank>=0.2.9",
    "rank-bm25>=0.2.2",
    
    # Ingestion & Visual Document Extraction
    "pymupdf>=1.24.0",
    "pdfplumber>=0.11.0",
    "unstructured>=0.15.0",
    "pytesseract>=0.3.10",
    "python-multipart>=0.0.9",
    "pillow>=10.4.0",
    
    # Observability & Metrics
    "langsmith>=0.1.125",
    "langfuse>=2.50.0",
    "arize-phoenix>=4.20.0",
    "openinference-instrumentation-langchain>=0.1.20",
    "prometheus-client>=0.20.0",
    
    # API Transport & WebSockets
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "sse-starlette>=2.1.0",
    "httpx>=0.27.0",
    
    # Configuration & Validation
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    
    # Presentation Layer (Decoupled UI)
    "streamlit>=1.38.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "black>=24.8.0",
    "isort>=5.13.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
